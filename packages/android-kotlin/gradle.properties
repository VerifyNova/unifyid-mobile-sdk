# The SDK depends on androidx.browser for the Custom Tab that carries the
# sign-in. AGP refuses to map a release source set whose runtime classpath holds
# AndroidX artifacts unless this is set, so without this file `assembleRelease`
# fails at :sdk:mapReleaseSourceSetPaths — for us and for anyone who adds the
# published SDK to their own project.
android.useAndroidX=true

# Nothing here is a pre-AndroidX support-library artifact, so there is nothing to
# rewrite. Stated rather than left to the default, which has changed before.
android.enableJetifier=false

# The Kotlin and Android plugins both run in this daemon; the default heap is
# enough for one module but not for the lint run that follows assembleRelease.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
